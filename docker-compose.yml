services:
  postgres:
    image: postgres:16-alpine
    container_name: multicoder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: multicoder
      POSTGRES_PASSWORD: multicoder
      POSTGRES_DB: multicoder
    ports:
      - "5432:5432"
    volumes:
      - multicoder_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multicoder -d multicoder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: multicoder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - multicoder_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: multicoder-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    # First start installs language runtimes; allow ~60s before Run works.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/api/v2/runtimes"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  multicoder_pg_data:
  multicoder_redis_data:
